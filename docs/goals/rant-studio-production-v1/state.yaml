version: 2

goal:
  title: "Rant Studio Production V1"
  slug: "rant-studio-production-v1"
  kind: existing_plan
  tranche: "Continuous production implementation until the complete V1 workflow and all oracle gates pass."
  status: done
  oracle:
    signal: "Fresh-project browser-and-CLI walkthrough renders valid 16:9 and 9:16 MP4s and passes model, service, CLI, browser, media, safety, and 150-shot gates."
    cadence: "After each Worker package, at architecture/media phase boundaries, and at final audit."
    final_proof: "Receipt-backed mapping from every approved V1 acceptance criterion to passing commands, artifacts, and the final live walkthrough."
  intake:
    original_request: "Use the approved Rant Studio specification and fixed mock-up to prepare a rigorous production implementation plan with GoalBuddy."
    interpreted_outcome: "Deliver working local-first Rant Studio V1 with one shared revisioned browser-and-agent workflow and real dual-format rendering."
    input_shape: existing_plan
    audience: "YouTube commentary creators collaborating with external agents"
    authority: approved
    proof_type: test
    completion_proof: "A fresh local fixture completes the full browser-and-CLI workflow, renders both MP4 formats, passes deterministic media and 150-shot performance fixtures, and survives final Judge audit."
    likely_misfire: "Polish or re-platform the five-shot mock-up while omitting durable state, authority enforcement, CLI parity, media correctness, recovery, or scale."
    blind_spots_considered:
      - "Provider adapters and secret handling"
      - "Revision conflicts and stale proposals"
      - "Cancellable and recoverable long-running jobs"
      - "Managed-media path and symlink safety"
      - "150-shot windowing with scroll and draft preservation"
      - "Per-shot and per-format preview overrides"
      - "Deterministic render and atomic publication"
    existing_plan_facts:
      - "docs/superpowers/specs/2026-07-27-rant-studio-design.md is the approved contract."
      - "Its Interactive Prototype Evidence section is the interaction oracle and production-gap map."
      - "The completed mock-up board is evidence, not an implementation dependency."
      - "Browser and CLI must share one revisioned local service and SQLite model."
      - "Human authority gates are enforced service-side."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/rant-studio-production-v1/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/rant-studio-production-v1"

active_task: null

tasks:
