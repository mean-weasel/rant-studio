      - "docs/superpowers/specs/2026-07-27-rant-studio-design.md"
      - "Interactive Prototype Evidence references"
      - "Current repository layout, scripts, tests, worktree, and dirty state"
      - "Queued task definitions in this board"
    constraints:
      - "Read-only; do not edit implementation or board files."
      - "Preserve every approved V1 acceptance criterion."
      - "Challenge file scopes, phase order, hidden dependencies, migration assumptions, and verification strength."
      - "Do not approve implementation that merely extends in-memory mock state."
    expected_output:
      - "approved | revise"
      - "Architecture and sequencing decision"
      - "Required repairs to queued task objectives, allowed_files, verify, or stop_if"
      - "Risks and dependency gates"
      - "Exact next Worker task"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The approved sequence is viable, but the repo is still a Vite-only in-memory prototype with no production service, CLI, SQLite, media worker, or production gate scripts. T010 is the correct largest safe first slice after adding monorepo paths, preserving the prototype, and requiring baseline plus new contract gates. Later Worker scopes must be repaired to actual apps/packages paths before activation, and T080 must not permit GoalBuddy or approved-spec edits. Node 22 and FFmpeg/ffprobe are available; current check, build, and 16 browser tests pass."
      worker_package:
        objective: "Establish the production monorepo foundation beside the preserved prototype: shared domain/API packages, SQLite migrations, revisioned loopback service, authority enforcement, and CLI client."
        allowed_files:
          - .gitignore
          - package.json
          - package-lock.json
          - "tsconfig*.json"
          - vite.config.ts
          - "apps/**"
          - "packages/**"
          - "src/**"
          - "server/**"
          - "shared/**"
          - "cli/**"
          - "db/**"
          - "migrations/**"
          - "tests/**"
          - "fixtures/**"
          - "scripts/**"
          - README.md
        verify:
          - "git diff --check"
          - "npm run check"
          - "npm run build"
          - "npm run test:model"
          - "npm run test:service"
          - "npm run test:cli"
          - "npm run test:e2e"
        stop_if:
          - "The required storage or service design conflicts with the approved specification."
          - "A migration would destroy or overwrite existing user data."
          - "The prototype cannot remain runnable while the production boundary is introduced."
          - "Need files outside allowed_files."
          - "Verification fails twice for the same unresolved cause."
      evidence:
        - docs/superpowers/specs/2026-07-27-rant-studio-design.md
        - "package.json contains only Vite mock-up scripts and React dependencies"
        - "src/App.tsx is the only stateful application implementation"
        - "No apps/, packages/, service, CLI, database, migrations, fixtures, or media worker exist"
        - "Node v22.22.3, FFmpeg 8.1, and ffprobe 8.1 are locally available"
        - "npm run check passed"
        - "npm run build passed"
        - "npm run test:e2e passed: 16 tests"
      blocked_tasks: []
      missing_evidence:
        - "No production persistence, restart, browser/CLI parity, authority, safety, media, or 150-shot evidence exists yet"
      required_board_updates:
        - "T010 was repaired with apps/**, packages/**, .gitignore, monorepo acceptance, and baseline gate preservation."
        - "Before activating T020 through T080, replace placeholder legacy scopes with the actual T010 workspace paths and add git diff --check."
        - "Before activating T080, replace docs/** with explicitly bounded operator-documentation paths so GoalBuddy and the approved specification remain PM-owned."
        - "Treat the current dirty/untracked prototype as owner work and preserve it; the recorded dirty fingerprint is the baseline."
      harness: codex
