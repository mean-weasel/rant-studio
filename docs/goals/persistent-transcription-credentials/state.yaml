version: 2

goal:
  title: "Persistent Transcription Credentials"
  slug: "persistent-transcription-credentials"
  kind: existing_plan
  tranche: "Validate and implement the complete macOS Keychain-backed app-and-CLI credential workflow."
  status: active
  oracle:
    signal: "Secret-canary tests plus a restart-persistent browser-and-CLI transcription walkthrough."
    cadence: "after each Worker package and at final audit"
    final_proof: "Canary leakage audit, persisted live transcription walkthrough, rotation/removal proof, and npm run test:release."
  intake:
    original_request: "Create an implementation plan using GoalBuddy Prep for persistent API keys in the app and CLI."
    interpreted_outcome: "Rant Studio securely persists OpenAI and Groq credentials for repeated human-agent QA without exposing raw keys."
    input_shape: existing_plan
    audience: "Rant Studio users and collaborating agents"
    authority: requested
    proof_type: test
    completion_proof: "A human can configure a provider in the app or CLI, both surfaces share readiness and transcription capability across restart, and security and release tests pass."
    likely_misfire: "Persisting an encrypted database value or UI secret that still exposes credentials to the browser, filesystem, logs, receipts, or agents."
    blind_spots_considered:
      - "Keychain automation and test isolation"
      - "exact-origin credential-route protection"
      - "environment and Keychain precedence"
      - "rotation and runtime cache invalidation"
      - "agent capability without secret retrieval"
      - "dirty branch preservation"
    existing_plan_facts:
      - "Use macOS Keychain for raw secrets."
      - "Keep only non-secret metadata in SQLite."
      - "Support app and CLI configuration against one local service."
      - "Environment variables override Keychain for CI and temporary QA."
      - "Support OpenAI and Groq first; the owner corrected the earlier xAI/Grok assumption."
      - "Never return a saved key after configuration."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/persistent-transcription-credentials/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/persistent-transcription-credentials"

