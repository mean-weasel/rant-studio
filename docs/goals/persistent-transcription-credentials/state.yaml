      harness: codex
      decision: approved
      full_outcome_complete: false
      rationale: "The Keychain-plus-metadata design fits the existing loopback service and dirty transcription work. The current provider is constructed once at startup, CORS trusts every localhost subdomain, and project:* acts as a broad scope wildcard; the first slice must replace startup-fixed selection with a credential-aware resolver and give secret mutations exact-origin plus human-authority checks. macOS security must receive writes through stdin, never argv. SQLite should persist provider, selection, health, timestamps, and an opaque Keychain account only. Existing project history secret rejection is useful but does not replace endpoint-specific redaction tests."
      worker_package:
        objective: "Implement the Keychain-backed credential registry and dynamic transcription-provider service API as one tested vertical slice, including metadata-only persistence, environment-over-Keychain precedence, exact-origin and human-authority enforcement, validation, selection, rotation, removal, and a fake secret-store adapter."
