version: 2

goal:
  title: "Semantic Shot Planning"
  slug: semantic-shot-planning
  kind: specific
  tranche: "Complete and verify the full local dual-mode semantic shot-planning workflow."
  status: done
  oracle:
    signal: "Both external-agent planning modes complete on the 10m17s / 1,463-word QA transcript with useful semantic boundaries, exact chronological word coverage, staged human review, and restart persistence."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing model, service, CLI, browser, and oracle tests plus receipt-backed manual browser/CLI walkthroughs of both modes on the real QA transcript and two deterministic fixtures."
  intake:
    original_request: "Plan semantic shot organization now."
    interpreted_outcome: "Build and verify an external-agent workflow that either discovers semantic shots or maps a transcript to a creator-supplied outline."
    input_shape: specific
    audience: "Local commentary-video creators and attached CLI agents"
    authority: requested
    proof_type: demo
    completion_proof: "The real 10m17s transcript and two fixtures pass structural verification, and human review confirms useful semantic themes and boundaries in both planning modes."
    likely_misfire: "Relabeling equal chronological chunks with plausible themes while leaving boundaries non-semantic."
    blind_spots_considered:
      - "External-agent ownership versus an accidental built-in-provider dependency"
      - "Semantic usefulness versus structural coverage alone"
      - "Soft target count versus mandatory equal partitioning"
      - "Directed-mode input shape and agent-visible context"
      - "Long transcript-chunk readability in the review UX"
      - "Revision staleness, idempotency, persistence, and raw transcript immutability"
      - "Narration cuts remaining a separate explicit human action"
      - "Credential leakage through prompts, task payloads, logs, or receipts"
    existing_plan_facts:
      - "Current QA baseline creates three generic equal chunks."
      - "Default starting count is three, treated as a soft target."
      - "Advanced constraints may bound count or duration."
      - "Directed mode accepts free-form direction plus optional ordered shot briefs."
      - "Every corrected transcript word must appear exactly once in chronological order."
      - "Agent proposals are staged for explicit human review before acceptance."
      - "The external CLI agent, not a built-in LLM provider, supplies semantic judgment."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/semantic-shot-planning/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /Users/neonwatty/Desktop/rant-studio/docs/goals/semantic-shot-planning"

